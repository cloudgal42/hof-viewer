<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Hall of Fame Viewer" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://viewer.halloffame.mtq.io/" />
    <meta
      property="og:description"
      content="View your and other creator's screenshots posted in Hall of Fame (Cities Skylines 2 Mod)."
    />
    <title>Hall of Fame Viewer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const isDarkModePreferred = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (window.localStorage.length === 0 && isDarkModePreferred) {
        console.log("Detected user preferring dark mode, so lets not blind them");
        document.querySelector("html").setAttribute("data-bs-theme", "dark");
        localStorage.setItem("isDarkMode", "true");
      }
    </script>
  </body>
</html>
