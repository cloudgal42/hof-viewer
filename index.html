<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:site_name" content="Hall of Fame Viewer" />
    <meta property="og:title" data-rh="true" content="Hall of Fame Viewer" />
    <meta property="og:type" data-rh="true" content="website" />
    <meta property="og:url" data-rh="true" content="https://viewer.halloffame.mtq.io/" />
    <meta
      property="og:description"
      data-rh="true"
      content="View your and other creator's screenshots posted in Hall of Fame (Cities Skylines 2 Mod)."
    />
    <link rel="stylesheet" href="src/css/App.scss" />
    <title data-rh="true">Hall of Fame Viewer</title>
    <script>window.prerenderReady = false;</script>
  </head>
  <body>
    <div id="root">
      <div class="w-100 vh-100 d-flex flex-column gap-1 align-items-center justify-content-center">
        <div class="spinner-grow" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
    <script>
      const isDarkModePreferred = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (window.localStorage.length === 0 && isDarkModePreferred) {
        console.log("Detected user preferring dark mode, so lets not blind them");
        document.querySelector("html").setAttribute("data-bs-theme", "dark");
        localStorage.setItem("isDarkMode", "true");
      } else if (localStorage.getItem("isDarkMode") === "true") {
        document.querySelector("html").setAttribute("data-bs-theme", "dark");
      }
    </script>
  </body>
</html>
